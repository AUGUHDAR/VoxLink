plugins {
    id 'net.neoforged.moddev' version '2.0.143'
}

//debounce NFRT走IPv4 避免maven.neoforged.net IPv6 TLS中断
try {
    def envClass = Class.forName('java.lang.ProcessEnvironment')
    def envField = envClass.getDeclaredField('theEnvironment')
    envField.setAccessible(true)
    def envMap = (Map) envField.get(null)
    envMap.put('JAVA_TOOL_OPTIONS', '-Djava.net.preferIPv4Stack=true')
} catch (Exception e) {
    logger.warn("Cannot set JAVA_TOOL_OPTIONS via reflection: {}", e.message)
}

version = project.mod_version + "-neoforge"
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

repositories {
    maven {
        name = 'Minecraft libraries'
        url = 'https://libraries.minecraft.net'
    }
    mavenCentral()
    // // e4mc 封存(2026-10-05): Skye 拒绝外部使用其基础设施, 待自建 quiclime 兼容中继后启用; 启用步骤见记忆 voxlink-e4mc-propagation-landmines
    // maven { url 'https://maven.is-quite.gay/' }
}

//debounce Android stub 仅PC编译用 不打包进jar
sourceSets {
    stubs {
        java {
            srcDir '../../core/src/stubs/java'
        }
    }
    main {
        compileClasspath += sourceSets.stubs.output
        java {
            srcDir '../../core/src/main/java'
        }
        resources {
            srcDir '../../core/src/main/resources'
        }
    }
}

compileStubsJava {
    options.release = Integer.parseInt(project.release_bytecode)
}
compileJava.dependsOn compileStubsJava
jar {
    exclude 'android/**'
}

neoForge {
    enable {
        version = project.neo_version
        disableRecompilation = true
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

/*
// e4mc 封存(2026-10-05): Skye 拒绝外部使用其基础设施, 待自建 quiclime 兼容中继后启用; 启用步骤见记忆 voxlink-e4mc-propagation-landmines
// e4mc 逃生通道: QUIC classes 解包嵌入 mod jar
configurations {
    e4mcQuic
}

*/
// e4mc 封存: 待自建 quiclime 中继后启用
sourceSets {
    main {
        java {
            exclude 'icu/wuhui/voxlink/e4mc/**'
            exclude 'icu/wuhui/voxlink/mixin/E4mcServerConnectionMixin.java'
        }
    }
}

dependencies {
    // e4mc 封存(2026-10-05): Skye 拒绝外部使用其基础设施, 待自建 quiclime 兼容中继后启用; 启用步骤见记忆 voxlink-e4mc-propagation-landmines
    /*
    // e4mc 逃生通道: Skye 补丁版 QUIC, forge/neoforge 无 loom include 故解包嵌入 jar
    implementation("io.netty.incubator:netty-incubator-codec-classes-quic:0.0.74.Final.e4mc") {
        transitive = false
    }
    e4mcQuic("io.netty.incubator:netty-incubator-codec-classes-quic:0.0.74.Final.e4mc") {
        transitive = false
    }
    */
    //debounce NeoForge自带mixin无需额外依赖
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        mod_id: project.mod_id,
        mod_version: project.mod_version,
        mod_license: project.mod_license,
        minecraft_version: project.minecraft_version,
        minecraft_version_range: project.minecraft_version_range,
        neo_version_range: project.neo_version_range,
        loader_version_range: project.loader_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = Integer.parseInt(project.release_bytecode)
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("../../LICENSE") {}
}

