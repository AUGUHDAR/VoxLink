plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '7.0.31'
}

version = project.mod_version + "-forge"
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))

sourceSets {
    stubs {
        java {
            srcDir 'src/stubs/java'
        }
    }
    main {
        compileClasspath += sourceSets.stubs.output
    }
}

compileStubsJava {
    options.release = Integer.parseInt(project.release_bytecode)
}
compileJava.dependsOn compileStubsJava

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    // // e4mc 封存(2026-10-05): Skye 拒绝外部使用其基础设施, 待自建 quiclime 兼容中继后启用; 启用步骤见记忆 voxlink-e4mc-propagation-landmines
    // maven { url 'https://maven.is-quite.gay/' }
}

/*
// e4mc 封存(2026-10-05): Skye 拒绝外部使用其基础设施, 待自建 quiclime 兼容中继后启用; 启用步骤见记忆 voxlink-e4mc-propagation-landmines
// e4mc 逃生通道: QUIC classes 解包嵌入 mod jar
configurations {
    e4mcQuic
}

*/
// e4mc 封存: 待自建 quiclime 中继后启用
sourceSets {
    main {
        java {
            exclude 'icu/wuhui/voxlink/e4mc/**'
            exclude 'icu/wuhui/voxlink/mixin/E4mcServerConnectionMixin.java'
        }
    }
}

dependencies {
    // e4mc 封存(2026-10-05): Skye 拒绝外部使用其基础设施, 待自建 quiclime 兼容中继后启用; 启用步骤见记忆 voxlink-e4mc-propagation-landmines
    /*
    // e4mc 逃生通道: Skye 补丁版 QUIC, forge/neoforge 无 loom include 故解包嵌入 jar
    implementation("io.netty.incubator:netty-incubator-codec-classes-quic:0.0.74.Final.e4mc") {
        transitive = false
    }
    e4mcQuic("io.netty.incubator:netty-incubator-codec-classes-quic:0.0.74.Final.e4mc") {
        transitive = false
    }
    */
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            forge_version          : project.forge_version,
            forge_version_range    : project.forge_version_range,
            loader_version_range   : project.loader_version_range,
            mod_id                 : project.mod_id,
            mod_version            : project.mod_version,
            mod_license            : project.mod_license,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    exclude 'android/**'
    manifest {
        attributes([
                'Specification-Title'     : project.mod_id,
                'Specification-Vendor'    : 'AUGUHDAR',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'AUGUHDAR',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'voxlink.mixins.json'
        ])
    }
    from("../../LICENSE") {}
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(project.release_bytecode)
}

