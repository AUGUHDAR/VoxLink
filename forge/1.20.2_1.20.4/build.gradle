buildscript {
    repositories {
        maven {
            name = 'SpongePowered'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = project.mod_version + "-forge"
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))

//stubs Android桩仅PC编译用
sourceSets {
    stubs {
        java {
            srcDir 'src/stubs/java'
        }
    }
    main {
        compileClasspath += sourceSets.stubs.output
    }
}

compileStubsJava {
    options.release = Integer.parseInt(project.release_bytecode)
}
compileJava.dependsOn compileStubsJava

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    runs {
        configureEach {
            workingDirectory 'run'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, 'voxlink-refmap.json'
    config 'voxlink.mixins.json'
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
    var replaceProperties = [
            mod_id                 : project.mod_id,
            mod_version            : project.mod_version,
            mod_license            : project.mod_license,
            minecraft_version_range: project.minecraft_version_range,
            forge_version_range    : project.forge_version_range,
            loader_version_range   : project.loader_version_range
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(project.release_bytecode)
}

jar {
    exclude 'android/**'
    manifest {
        attributes([
                'Specification-Title'     : project.mod_id,
                'Specification-Vendor'    : 'AUGUHDAR',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.mod_version,
                'Implementation-Vendor'   : 'AUGUHDAR',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'voxlink.mixins.json'
        ])
    }
    from("../../LICENSE") {}
}
