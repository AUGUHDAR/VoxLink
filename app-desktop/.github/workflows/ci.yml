# 每次推送的最小验证：CLI 版（纯 Go）三平台交叉编译 + 单测。
#
# 刻意不在这里验 UI 版：UI 要 CGO + 各平台 GTK/WebKit/macOS SDK，
# 在 ubuntu runner 上"能不能编"取决于 runner 的 CGO 环境，与"代码对不对"混在一起看不清。
# UI 版的真实构建与验证放在 release.yml（每个平台用自己的 runner）。

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write   # 失败时把日志尾巴开成 issue：Actions 日志要 admin 权限才能下载，
                  # 仓库方（我）拿不到，只能靠这一步自曝。

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet（untagged 兜底入口）
        shell: bash
        run: go vet . 2>&1 | tee /tmp/vet-untagged.log

      - name: go vet（-tags cli）
        shell: bash
        run: go vet -tags cli . 2>&1 | tee /tmp/vet-cli.log

      - name: 单测（untagged）
        shell: bash
        run: go test -count=1 -timeout 240s . 2>&1 | tee /tmp/test-untagged.log

      - name: 单测（-tags cli）
        shell: bash
        run: go test -count=1 -timeout 240s -tags cli . 2>&1 | tee /tmp/test-cli.log

      - name: CLI 三平台交叉编译
        shell: bash
        run: |
          for t in windows/amd64 linux/amd64 linux/arm64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -tags cli -ldflags "-s -w" -o /tmp/probe-$os-$arch .
            echo "  ok $os/$arch"
          done

      # 任一环节挂了就把日志尾巴写成 issue（含失败用例名，便于定位平台差异）
      - name: 失败自曝
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## CI 失败摘要（commit ${GITHUB_SHA:0:7}）"
            echo
            for f in /tmp/vet-untagged.log /tmp/vet-cli.log /tmp/test-untagged.log /tmp/test-cli.log; do
              [ -f "$f" ] || continue
              hits=$(grep -E "^(--- FAIL|--- PASS|FAIL|panic:|ok  )|^vet\.exe:|\.go:[0-9]+:[0-9]+:" "$f" | head -40)
              [ -n "$hits" ] || continue
              echo "### $f"
              echo '```'
              echo "$hits"
              echo '```'
            done
            echo
            echo "### 最后 30 行原文（上面没抓到东西时看这里）"
            echo '```'
            tail -30 /tmp/test-untagged.log /tmp/test-cli.log 2>/dev/null || true
            echo '```'
            echo
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/report.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "ci: ${GITHUB_SHA:0:7} 在 linux 上失败" \
            --body-file /tmp/report.md || true

