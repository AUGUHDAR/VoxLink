plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.9'
}

version = project.mod_version + "-fabric"
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

repositories {
    mavenCentral()
    // // e4mc 封存(2026-10-05): Skye 拒绝外部使用其基础设施, 待自建 quiclime 兼容中继后启用
    // maven { url 'https://maven.is-quite.gay/' }
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "voxlink-refmap.json"
    }
    // Lab automation runs
}

//debounce Android stub 仅PC编译用 不打包进jar
sourceSets {
    stubs {
        java {
            srcDir 'src/stubs/java'
        }
    }
    main {
        compileClasspath += sourceSets.stubs.output
    }
}

//debounce stubs编译不打包进jar 只为main提供android.*符号
compileStubsJava {
    options.release = Integer.parseInt(project.release_bytecode)
}
compileJava.dependsOn compileStubsJava
jar {
    exclude 'android/**'
}

// e4mc 封存: 待自建 quiclime 中继后启用
sourceSets {
    main {
        java {
            exclude 'icu/wuhui/voxlink/e4mc/**'
            exclude 'icu/wuhui/voxlink/mixin/E4mcServerConnectionMixin.java'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // e4mc 封存(2026-10-05): Skye 拒绝外部使用其基础设施, 待自建 quiclime 兼容中继后启用
    /*
    // e4mc 逃生通道: Skye 补丁版 QUIC 嵌包(263KB), native 由 natives.e4mc.link 运行时下发
    implementation("io.netty.incubator:netty-incubator-codec-classes-quic:0.0.74.Final.e4mc") {
        transitive = false
    }
    include("io.netty.incubator:netty-incubator-codec-classes-quic:0.0.74.Final.e4mc") {
        transitive = false
    }
    */
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        mod_id: project.mod_id,
        mod_version: project.mod_version,
        minecraft_version: project.minecraft_version,
        minecraft_version_range: project.minecraft_version_range,
        fabric_version_range : project.fabric_version_range,
        fabric_loader_version_range: project.fabric_loader_version_range,
        version: project.mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = Integer.parseInt(project.release_bytecode)
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("../../LICENSE") {}
}
